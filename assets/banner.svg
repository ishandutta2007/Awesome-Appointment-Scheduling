<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatOpposite {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes pingDot {
        0% { r: 4px; opacity: 1; }
        100% { r: 12px; opacity: 0; }
      }
      @keyframes slidePill {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(8px); }
      }
      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatOpposite 8s ease-in-out infinite;
      }
      .ambient-glow {
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .ping-circle {
        animation: pingDot 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .animated-pill {
        animation: slidePill 5s ease-in-out infinite;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .text-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs in Background -->
  <circle cx="180" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.15" class="ambient-glow" />
  <circle cx="1020" cy="260" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.18" class="ambient-glow" style="animation-delay: -3s;" />
  <circle cx="600" cy="180" r="200" fill="#6366f1" filter="url(#glow)" opacity="0.1" class="ambient-glow" style="animation-delay: -1.5s;" />

  <!-- Background Decorative Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Dynamic / Animated Background Element 1: Left Mini Schedule Card -->
  <g class="floating-card-1" opacity="0.75">
    <rect x="70" y="70" width="220" height="96" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Booking slot icon -->
    <rect x="88" y="86" width="32" height="32" rx="8" fill="#38bdf8" fill-opacity="0.2" />
    <path d="M96 98h16M96 104h10M100 92v3M108 92v3" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="130" y="99" fill="#f8fafc" font-size="12" class="text-sub">Demo Discovery Call</text>
    <text x="130" y="114" fill="#94a3b8" font-size="11" class="text-mono">10:00 AM • 30 mins</text>
    <!-- Live ping status -->
    <circle cx="266" cy="94" r="4" fill="#34d399" />
    <circle cx="266" cy="94" r="4" fill="#34d399" class="ping-circle" />
    <rect x="88" y="132" width="184" height="6" rx="3" fill="#ffffff" fill-opacity="0.08" />
    <rect x="88" y="132" width="128" height="6" rx="3" fill="#38bdf8" fill-opacity="0.7" />
  </g>

  <!-- Dynamic / Animated Background Element 2: Right Calendar Slot Pill -->
  <g class="floating-card-2" opacity="0.8">
    <rect x="910" y="65" width="220" height="90" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
    <rect x="926" y="82" width="30" height="30" rx="8" fill="#818cf8" fill-opacity="0.2" />
    <circle cx="941" cy="97" r="6" stroke="#818cf8" stroke-width="2" fill="none" />
    <text x="968" y="95" fill="#f8fafc" font-size="12" class="text-sub">Round-Robin Router</text>
    <text x="968" y="111" fill="#a5b4fc" font-size="11" class="text-mono">Next rep: Matched ⚡</text>
    <rect x="926" y="125" width="70" height="18" rx="9" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="939" y="138" fill="#34d399" font-size="10" class="text-mono">✓ Confirmed</text>
  </g>

  <!-- Foreground Center Content (Guaranteed Crisp & Layered Above) -->
  <g id="foreground-content">
    <!-- Top Category Tag / Animated Pill -->
    <g class="animated-pill">
      <rect x="440" y="44" width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="458" cy="60" r="5" fill="#38bdf8" />
      <text x="472" y="65" fill="#e2e8f0" font-size="12" class="text-sub" font-weight="600">⚡ BOOKING INFRASTRUCTURE &amp; CALENDARS</text>
    </g>

    <!-- Main Title with Gradient fill -->
    <text x="600" y="146" text-anchor="middle" fill="url(#primaryGrad)" font-size="44" class="text-title" filter="url(#glow)" opacity="0.95">
      Awesome Appointment Scheduling
    </text>

    <!-- Subtitle / Value Proposition in crisp Foreground -->
    <text x="600" y="190" text-anchor="middle" fill="#f1f5f9" font-size="17" class="text-sub">
      The Curated Ecosystem of SaaS Schedulers, Routing Engines &amp; Open-Source Booking Infrastructure
    </text>

    <!-- Feature Feature Tag Badges at Bottom -->
    <g transform="translate(230, 230)">
      <!-- Badge 1: SaaS Leaders -->
      <g transform="translate(0, 0)">
        <rect width="160" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
        <text x="24" y="26" font-size="16">🏢</text>
        <text x="48" y="26" fill="#cbd5e1" font-size="13" class="text-sub">SaaS Leaders</text>
      </g>

      <!-- Badge 2: Open Source -->
      <g transform="translate(190, 0)">
        <rect width="180" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
        <text x="20" y="26" font-size="16">💻</text>
        <text x="44" y="26" fill="#cbd5e1" font-size="13" class="text-sub">Open-Source &amp; Cal</text>
      </g>

      <!-- Badge 3: Team Routing -->
      <g transform="translate(390, 0)">
        <rect width="165" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
        <text x="22" y="26" font-size="16">🔄</text>
        <text x="46" y="26" fill="#cbd5e1" font-size="13" class="text-sub">Lead Routing</text>
      </g>

      <!-- Badge 4: Calendar Sync -->
      <g transform="translate(575, 0)">
        <rect width="165" height="42" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
        <text x="22" y="26" font-size="16">📅</text>
        <text x="46" y="26" fill="#cbd5e1" font-size="13" class="text-sub">Calendar Sync</text>
      </g>
    </g>
  </g>
</svg>
